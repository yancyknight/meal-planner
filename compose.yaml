services:
  app:
    build: .
    ports:
      - "3001:3000"
    volumes:
      - app_data:/data
    environment:
      DATABASE_URL: /data/app.db
      IMAGE_DIR: /data/images
      NUXT_PUBLIC_APP_NAME: Meal Planner
    restart: unless-stopped

  test:
    build:
      context: .
      target: test
    working_dir: /app
    volumes:
      - .:/app
      - test_node_modules:/app/node_modules
    command: pnpm test

volumes:
  app_data:
  test_node_modules:
