services:
  app:
    build: .
    ports:
      - "3001:3000"
    volumes:
      - app_data:/data
    environment:
      DATABASE_URL: /data/app.db
      IMAGE_DIR: /data/images
    restart: unless-stopped

  test:
    build:
      context: .
      target: test
    working_dir: /app
    volumes:
      - .:/app
      - test_node_modules:/app/node_modules
    environment:
      DATABASE_URL: /tmp/test-app.db
      IMAGE_DIR: /tmp/test-images
    command: pnpm test

volumes:
  app_data:
  test_node_modules:
